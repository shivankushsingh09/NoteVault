<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Notes App</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold">📝 Notes App</span>

            <div class="d-flex align-items-center gap-2">
                <div class="search-wrapper position-relative">
                    <input id="searchInput" class="form-control search-box" placeholder="Search notes (Ctrl+K)"
                        autocomplete="off">
                    <button id="clearSearchBtn"
                        class="btn btn-sm position-absolute end-0 top-50 translate-middle-y me-1 d-none" type="button"
                        title="Clear search">
                        <i class="bi bi-x"></i>
                    </button>
                    <div id="searchSuggestions"
                        class="search-suggestions position-absolute w-100 bg-card border rounded mt-1 d-none"></div>
                </div>
                <button class="btn theme-btn" onclick="toggleTheme()" title="Toggle Theme">
                    <i class="bi bi-moon-stars-fill"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main -->
    <div class="container mt-4">

        <!-- Add Note -->
        <div class="card app-card">
            <div class="card-header fw-semibold">Add New Note</div>
            <div class="card-body">
                <input id="noteTitleInput" class="form-control" placeholder="Title">
                <textarea id="noteInput" class="form-control mt-2" rows="3"
                    placeholder="Write your description..."></textarea>
                <button class="btn btn-primary mt-3" onclick="addNote()">Add Note</button>
            </div>
        </div>

        <h5 class="mt-4 fw-semibold">Your Notes</h5>
        <div id="notesContainer" class="row mt-2"></div>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content app-modal">
                <div class="modal-header">
                    <h5>Edit Note</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input id="editNoteTitle" class="form-control mb-2" placeholder="Title">
                    <textarea id="editNoteText" class="form-control" rows="5"></textarea>
                    <input type="hidden" id="editIndex">
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" onclick="saveEdit()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- VIEW MODAL -->
    <div class="modal fade" id="viewModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content app-modal">
                <div class="modal-header">
                    <h5>View Note</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <h6 id="viewNoteTitle" class="mb-2"></h6>
                    <p id="viewNoteContent"></p>
                    <small id="viewNoteDate" class="opacity-75"></small>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="downloadModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content app-modal">
                <div class="modal-header">
                    <h5>Download Note</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="downloadIndex">
                    <div class="d-grid gap-2">
                        <button class="btn btn-outline-primary" onclick="downloadNoteAs('pdf')">Download as PDF</button>
                        <button class="btn btn-outline-primary" onclick="downloadNoteAs('txt')">Download as TXT</button>
                        <button class="btn btn-outline-primary" onclick="downloadNoteAs('md')">Download as
                            Markdown</button>
                        <button class="btn btn-outline-primary" onclick="downloadNoteAs('json')">Download as
                            JSON</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- DELETE CONFIRM MODAL -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content app-modal">
                <div class="modal-header">
                    <h5>Delete Note</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="deleteIndex">
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="deleteConfirmCheck">
                        <label class="form-check-label" for="deleteConfirmCheck">
                            Are you sure you want to delete this note?
                        </label>
                    </div>
                    <div id="deleteTitleSection" class="d-none">
                        <label for="deleteTitleInput" class="form-label">Type the note title to confirm:</label>
                        <input type="text" id="deleteTitleInput" class="form-control" placeholder="Enter title">
                        <small class="text-muted">This action cannot be undone.</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="confirmDeleteBtn" class="btn btn-danger" disabled>Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="appToast" class="toast">
            <div class="toast-body" id="toastMsg"></div>
        </div>
    </div>

    <!-- Global Spinner Overlay -->
    <div id="spinnerOverlay" class="spinner-overlay d-none">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>
